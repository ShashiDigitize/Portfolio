<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin — manage portfolio models.">
  <meta name="theme-color" content="#ece7df">
  <title>Admin — Zulfekar Ahmad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("zulf-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <header class="nav" id="top">
    <a class="nav-brand" href="index.html">Zulfekar Ahmad</a>
    <div class="nav-right">
      <a class="btn btn-secondary" href="models.html">Back to models</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="admin-wrap">

      <section class="admin-login" id="login-card">
        <h1 class="model-view-title">Admin</h1>
        <p class="model-view-type">Sign in to manage models</p>
        <form class="admin-form" id="login-form">
          <label>Username
            <input type="text" id="login-user" autocomplete="username">
          </label>
          <label>Password
            <input type="password" id="login-pass" autocomplete="current-password">
          </label>
          <label>GitHub Token
            <input type="text" id="github-token" placeholder="ghp_... your token" autocomplete="off">
          </label>
          <p class="admin-error" id="login-error" hidden>Incorrect credentials.</p>
          <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
      </section>

      <section class="admin-panel" id="panel" hidden>
        <div class="admin-head">
          <div>
            <h1 class="model-view-title">Manage models</h1>
            <p class="model-view-type">Upload a file and save — the path is set automatically and pushed to GitHub.</p>
          </div>
          <div class="admin-actions">
            <button class="btn btn-secondary" type="button" id="export-btn">Export JSON</button>
            <button class="btn btn-secondary" type="button" id="logout-btn">Log out</button>
          </div>
        </div>
        <p class="admin-note" id="admin-status"></p>

        <form class="admin-form" id="model-form">
          <div class="admin-grid">
            <label>Title
              <input type="text" id="f-title" required>
            </label>
            <label>Type
              <input type="text" id="f-type" placeholder="Environment">
            </label>
          </div>
          <label>Description
            <textarea id="f-desc" rows="3"></textarea>
          </label>
          <label>Model file (.fbx / .glb / .gltf / .obj)
            <input type="file" id="f-upload" accept=".fbx,.glb,.gltf,.obj" required>
          </label>
          <p class="admin-note" id="file-path-note">Upload a file — the path is filled in automatically.</p>
          <div class="admin-form-actions">
            <button class="btn btn-primary" type="submit" id="form-submit">Add model</button>
            <button class="btn btn-secondary" type="button" id="form-cancel" hidden>Cancel edit</button>
          </div>
        </form>

        <ul class="admin-list" id="model-list"></ul>
      </section>

    </div>
  </main>

  <noscript>
    <p class="noscript-note">This admin page needs JavaScript.</p>
  </noscript>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script type="module" src="js/threejs/init.js"></script>
  <script src="js/main.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
